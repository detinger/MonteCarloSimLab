name: Lab checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Smoke test the Railway container
        run: sh scripts/smoke-container.sh
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
      - run: npm ci
      - run: python -m pip install scipy matplotlib nbformat nbclient ipykernel
      - run: python tests/engine-notebooks.py
      - run: python tests/additional-notebooks.py
      - run: python tests/builder-input-notebook.py
